<script>
'use strict';
/* =====================================================================
   Trillion Bank — 30s CM. Deterministic: renderAt(t) is a pure function
   of time, so frames can be captured in any order (motion-blur subframes).
   Copy sources: see STORYBOARD.md.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = 1920, H = 1080, DUR = 30, FPS = 30;
const WORLD = document.getElementById('world');
const FLASH = document.getElementById('flash');
const VIG = document.getElementById('vig');
const FX = document.getElementById('fx'), fxc = FX.getContext('2d');
const IMG = { // official materials from the public site
  base: '../../trillionbank/assets/images/toriuru/toriuru-base.webp',
  ears: '../../trillionbank/assets/images/toriuru/toriuru-ears.webp',
  tail: '../../trillionbank/assets/images/toriuru/toriuru-tail.webp',
  wmInk: 'assets/wordmark-ink.png',
  wmBlue: 'assets/wordmark-blue.png',
};

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: u => u,
  inQuad: u => u * u,
  outQuad: u => 1 - (1 - u) * (1 - u),
  inCubic: u => u * u * u,
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inOutCubic: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  outQuart: u => 1 - Math.pow(1 - u, 4),
  inOutQuart: u => u < .5 ? 8 * u ** 4 : 1 - Math.pow(-2 * u + 2, 4) / 2,
  outQuint: u => 1 - Math.pow(1 - u, 5),
  inOutQuint: u => u < .5 ? 16 * u ** 5 : 1 - Math.pow(-2 * u + 2, 5) / 2,
  inExpo: u => u <= 0 ? 0 : Math.pow(2, 10 * u - 10),
  outExpo: u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u),
  inOutExpo: u => u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2,
  outBack: u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const tw = (t, a, b, e = E.outExpo) => e(P(t, a, b));
// damped spring 0 -> 1 (s = seconds since start)
const spr = (s, f = 2.1, d = 6.5) => s <= 0 ? 0 : 1 - Math.exp(-d * s) * Math.cos(2 * Math.PI * f * s);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const frameOf = t => Math.floor(t * FPS + 1e-6);
const env = (t, a, b, fi = .2, fo = .2) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b));

/* ---------- dom ---------- */
function h(tag, attrs, parent, html) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'style') e.style.cssText = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const T = (e, s) => { e.style.transform = s; };
const O = (e, v) => { e.style.opacity = v; };
const F = (e, v) => { e.style.filter = v; };
const vis = (e, v) => { e.style.visibility = v ? 'inherit' : 'hidden'; };

// one masked line of characters; segs: [[text, groupClass]]
function splitLine(parent, segs, cls) {
  if (typeof segs === 'string') segs = [[segs, '']];
  const mask = h('div', { class: 'mask' }, parent);
  const line = h('div', { class: 'line ' + (cls || '') }, mask);
  const chars = [];
  for (const [text, gcls] of segs) {
    const host = gcls ? h('span', { class: 'gw ' + gcls }, line) : line;
    for (const c of [...text]) chars.push(h('span', { class: 'ch' + (gcls ? ' gc' : '') }, host, c === ' ' ? ' ' : c));
  }

/* ---------- global camera shake on impacts ---------- */
const IMPACTS = [[4.0, 9], [7.0, 3], [12.63, 3], [14.5, 8], [20.0, 7], [21.0, 5], [22.0, 5], [23.0, 5], [24.0, 4], [27.05, 2.5]];
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, a] of IMPACTS) { const s = t - ti; if (s < 0 || s > .5) continue; const d = Math.exp(-s * 11) * a; x += Math.sin(s * 2 * Math.PI * 17) * d; y += Math.cos(s * 2 * Math.PI * 13) * d * .7; }
  return [x, y];
}

/* ---------- fx: flash, vignette, grain ---------- */
const GRAIN = [];
function makeGrain() {
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = 960; c.height = 540;
    const g = c.getContext('2d'), im = g.createImageData(960, 540); let seed = 1234 + k * 999;
    const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); GRAIN.push(c);
  }
}
const flashAt = (t, tc, pre, post, amp) => t < tc ? E.inQuad(P(t, tc - pre, tc)) * amp : (1 - E.outCubic(P(t, tc, tc + post))) * amp;
function fx(t) {
  const fl = Math.max(flashAt(t, 4.0, .18, .32, 1), flashAt(t, 20.0, .08, .2, .85), flashAt(t, 24.0, .14, .3, .9));
  O(FLASH, fl.toFixed(3));
  const dark = (t < 4.0) || (t > 14.5 && t < 20.0) || (t > 22 && t < 23);
  O(VIG, dark ? .9 : 0);
  fxc.clearRect(0, 0, W, H);
  const fi = frameOf(t);
  fxc.globalAlpha = dark ? .4 : .15;
  fxc.imageSmoothingEnabled = true;
  fxc.drawImage(GRAIN[fi % GRAIN.length], -(hash(fi) * 40), -(hash(fi * 3) * 40), W + 80, H + 80);
  fxc.globalAlpha = 1;
}

/* ---------- render ---------- */
function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-4);
  for (const s of SCENES) {
    const on = t >= s.t0 && t < s.t1;
    s.el.style.visibility = on ? 'visible' : 'hidden';
    if (on && s.update) s.update(t);
  }
  const [sx, sy] = shake(t);
  T(WORLD, `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px)`);
  fx(t);
}
