name: Deploy static site to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-vercel-static
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - name: Build Jekyll site
        run: bash scripts/jekyll_build.sh

      - name: Publish _site to vercel-deploy branch
        env:
          SHORT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          export WORKDIR
          cp -a _site/. "$WORKDIR/"
          mkdir -p "$WORKDIR/api"
          cp -a api/. "$WORKDIR/api/"
          rm -rf "$WORKDIR/.git"
          printf '%s\n' '{' '  "name": "trillion-bank-hp",' '  "private": true' '}' > "$WORKDIR/package.json"
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          p = Path(os.environ["WORKDIR"]) / "vercel.json"
          p.write_text(json.dumps({
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": None,
            "buildCommand": None,
            "installCommand": None,
            "outputDirectory": ".",
            "cleanUrls": True,
            "trailingSlash": True
          }, indent=2) + "\n")
          PY
          cd "$WORKDIR"
          rm -f package-lock.json mise.toml Gemfile Gemfile.lock .ruby-version
          test -f api/hack2-measure.js
          test -f api/gap-analyze.js
          test -f api/site-analyze.js
          git init -b vercel-deploy
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          SHORT="${SHORT_SHA:0:7}"
          git commit -m "Publish prebuilt Jekyll site for Vercel (${SHORT})"
          echo "Pushing vercel-deploy (${SHORT})..."
          # Prefer Authorization header over embedding the token in the URL.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}"             push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:vercel-deploy             || { echo "::error::git push to vercel-deploy failed"; git remote -v || true; exit 1; }
          echo "Push complete."
