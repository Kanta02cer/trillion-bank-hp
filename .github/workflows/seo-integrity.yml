name: SEO integrity

on:
  pull_request:
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap-news.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - '.github/workflows/seo-integrity.yml'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap-news.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - '.github/workflows/seo-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify approved Insights indexing and sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          approved = {
              '_tbnews/2026-09-05-seo-aeo-geo-aio-llmo-difference.md': '/trillionbank/news/seo-aeo-geo-aio-llmo-difference/',
              '_tbnews/2026-09-05-ai-search-measurement-method.md': '/trillionbank/news/ai-search-measurement-method/',
              '_tbnews/2026-09-05-pay-per-crawl-pay-per-use-difference.md': '/trillionbank/news/pay-per-crawl-pay-per-use-difference/',
              '_tbnews/2026-07-23-pay-per-crawl-towa.md': '/trillionbank/news/pay-per-crawl-towa/',
              '_tbnews/2026-09-05-ai-citation-rate-calculation.md': '/trillionbank/news/ai-citation-rate-calculation/',
              '_tbnews/2026-09-05-ai-search-monitoring-rfp-checklist.md': '/trillionbank/news/ai-search-monitoring-rfp-checklist/',
              '_tbnews/2026-07-18-llmo-towa.md': '/trillionbank/news/llmo-towa/',
              '_tbnews/2026-07-19-prompt-collection.md': '/trillionbank/news/prompt-collection/',
              '_tbnews/2026-07-20-latest-ai-models.md': '/trillionbank/news/latest-ai-models/',
              '_tbnews/2026-07-25-aeo-tools.md': '/trillionbank/news/aeo-tools/',
              '_tbnews/2026-07-26-llmo-geo-aeo.md': '/trillionbank/news/llmo-geo-aeo/',
              '_tbnews/2026-07-26-not-cited-by-ai.md': '/trillionbank/news/not-cited-by-ai/',
              '_tbnews/2026-09-06-llms-txt-guide.md': '/trillionbank/news/llms-txt-guide/',
              '_tbnews/2026-09-06-ai-crawler-list-control.md': '/trillionbank/news/ai-crawler-list-control/',
              '_tbnews/2026-09-06-json-ld-eeat-ai-search.md': '/trillionbank/news/json-ld-eeat-ai-search/',
              '_tbnews/2026-09-06-ai-search-tools-vendors.md': '/trillionbank/news/ai-search-tools-vendors/',
              '_tbnews/2026-09-06-ai-search-statistics.md': '/trillionbank/news/ai-search-statistics/',
              '_tbnews/2026-09-06-chatgpt-search-optimization.md': '/trillionbank/news/chatgpt-search-optimization/',
              '_tbnews/2026-09-06-ai-overviews-optimization.md': '/trillionbank/news/ai-overviews-optimization/',
              '_tbnews/2026-09-15-partner-ad-agency-pitch.md': '/trillionbank/news/partner-ad-agency-pitch/',
              '_tbnews/2026-09-15-partner-co-sell-process.md': '/trillionbank/news/partner-co-sell-process/',
              '_tbnews/2026-09-15-partner-faq-scope-roles.md': '/trillionbank/news/partner-faq-scope-roles/',
              '_tbnews/2026-09-15-partner-first-client-playbook.md': '/trillionbank/news/partner-first-client-playbook/',
              '_tbnews/2026-09-15-partner-meeting-prep-checklist.md': '/trillionbank/news/partner-meeting-prep-checklist/',
              '_tbnews/2026-09-15-partner-not-becoming-your-agent.md': '/trillionbank/news/partner-not-becoming-your-agent/',
              '_tbnews/2026-09-15-partner-program-overview.md': '/trillionbank/news/partner-program-overview/',
              '_tbnews/2026-09-15-partner-seo-firm-add-on.md': '/trillionbank/news/partner-seo-firm-add-on/',
              '_tbnews/2026-09-15-partner-web-production-add-on.md': '/trillionbank/news/partner-web-production-add-on/',
              '_tbnews/2026-09-15-partner-who-fits.md': '/trillionbank/news/partner-who-fits/',
              '_tbnews/2026-09-15-sme-ai-search-budget-justification.md': '/trillionbank/news/sme-ai-search-budget-justification/',
              '_tbnews/2026-09-15-sme-ai-search-common-first-mistakes.md': '/trillionbank/news/sme-ai-search-common-first-mistakes/',
              '_tbnews/2026-09-15-sme-ai-search-first-30-days.md': '/trillionbank/news/sme-ai-search-first-30-days/',
              '_tbnews/2026-09-15-sme-ai-seo-myths.md': '/trillionbank/news/sme-ai-seo-myths/',
              '_tbnews/2026-09-15-sme-board-proposal-template.md': '/trillionbank/news/sme-board-proposal-template/',
              '_tbnews/2026-09-15-sme-btob-services-ai-recommend.md': '/trillionbank/news/sme-btob-services-ai-recommend/',
              '_tbnews/2026-09-15-sme-chatgpt-not-mentioned.md': '/trillionbank/news/sme-chatgpt-not-mentioned/',
              '_tbnews/2026-09-15-sme-contact-ready-checklist.md': '/trillionbank/news/sme-contact-ready-checklist/',
              '_tbnews/2026-09-15-sme-content-inventory-for-ai.md': '/trillionbank/news/sme-content-inventory-for-ai/',
              '_tbnews/2026-09-15-sme-education-school-ai-search.md': '/trillionbank/news/sme-education-school-ai-search/',
              '_tbnews/2026-09-15-sme-entity-consistency-checklist.md': '/trillionbank/news/sme-entity-consistency-checklist/',
              '_tbnews/2026-09-15-sme-faq-schema-starter.md': '/trillionbank/news/sme-faq-schema-starter/',
              '_tbnews/2026-09-15-sme-franchise-hq-ai-search.md': '/trillionbank/news/sme-franchise-hq-ai-search/',
              '_tbnews/2026-09-15-sme-local-brand-ai-and-maps.md': '/trillionbank/news/sme-local-brand-ai-and-maps/',
              '_tbnews/2026-09-15-sme-manufacturing-ai-search.md': '/trillionbank/news/sme-manufacturing-ai-search/',
              '_tbnews/2026-09-15-sme-measure-before-tools.md': '/trillionbank/news/sme-measure-before-tools/',
              '_tbnews/2026-09-15-sme-owner-ceo-ai-search-decision.md': '/trillionbank/news/sme-owner-ceo-ai-search-decision/',
              '_tbnews/2026-09-15-sme-seo-vendor-questions.md': '/trillionbank/news/sme-seo-vendor-questions/',
              '_tbnews/2026-09-15-sme-vs-competitor-ai-visibility.md': '/trillionbank/news/sme-vs-competitor-ai-visibility/',
              '_tbnews/2026-09-15-sme-when-not-to-outsource.md': '/trillionbank/news/sme-when-not-to-outsource/',
          }
          site_origin = 'https://trillion-bank.jp'

          marked_insights = set()
          for source in Path('_tbnews').glob('*.md'):
              text = source.read_text(encoding='utf-8')
              if re.search(r'(?m)^insight:\s*true\s*$', text):
                  marked_insights.add(source.as_posix())

          expected_sources = set(approved)
          if marked_insights != expected_sources:
              added = sorted(marked_insights - expected_sources)
              removed = sorted(expected_sources - marked_insights)
              details = []
              if added:
                  details.append('Unapproved insight:true files:\n- ' + '\n- '.join(added))
              if removed:
                  details.append('Approved insight files missing insight:true:\n- ' + '\n- '.join(removed))
              raise SystemExit('\n\n'.join(details))

          expected_urls = set()
          for source, route in approved.items():
              output = Path('_site') / route.lstrip('/') / 'index.html'
              if not output.is_file():
                  raise SystemExit(f'Missing generated Insight page: {output}')

              html = output.read_text(encoding='utf-8')
              robots_match = re.search(
                  r'<meta\s+[^>]*name=["\']robots["\'][^>]*content=["\']([^"\']+)',
                  html,
                  flags=re.IGNORECASE,
              )
              if not robots_match:
                  raise SystemExit(f'Missing robots meta on {route}')
              robots = robots_match.group(1).lower()
              if 'noindex' in robots or 'index' not in robots:
                  raise SystemExit(f'Approved Insight is not indexable: {route} -> {robots}')

              canonical_match = re.search(
                  r'<link\s+[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)',
                  html,
                  flags=re.IGNORECASE,
              )
              expected_url = f'{site_origin}{route}'
              if not canonical_match or canonical_match.group(1) != expected_url:
                  actual = canonical_match.group(1) if canonical_match else 'missing'
                  raise SystemExit(f'Canonical mismatch: {route} -> {actual}; expected {expected_url}')
              expected_urls.add(expected_url)

          sitemap_path = Path('_site/sitemap-news.xml')
          if not sitemap_path.is_file():
              raise SystemExit('Generated sitemap-news.xml is missing')

          root = ET.fromstring(sitemap_path.read_text(encoding='utf-8'))
          namespace = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap_urls = [
              node.text.strip()
              for node in root.findall('sm:url/sm:loc', namespace)
              if node.text and node.text.strip()
          ]

          if len(sitemap_urls) != len(set(sitemap_urls)):
              raise SystemExit(f'Duplicate URLs in sitemap-news.xml: {sitemap_urls}')
          if set(sitemap_urls) != expected_urls:
              unexpected = sorted(set(sitemap_urls) - expected_urls)
              missing = sorted(expected_urls - set(sitemap_urls))
              details = []
              if unexpected:
                  details.append('Unexpected sitemap URLs:\n- ' + '\n- '.join(unexpected))
              if missing:
                  details.append('Missing sitemap URLs:\n- ' + '\n- '.join(missing))
              raise SystemExit('\n\n'.join(details))

          if any(url.startswith(f'{site_origin}/news/') for url in sitemap_urls):
              raise SystemExit('Legacy /news/ URL found in reviewed Insights sitemap')

          print(f'SEO integrity passed: {len(expected_urls)} approved Insights pages')
          PY
