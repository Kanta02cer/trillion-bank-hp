name: SEO integrity

on:
  pull_request:
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap-news.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - '.github/workflows/seo-integrity.yml'
  push:
    branches: [main]
    paths:
      - '_config.yml'
      - '_tbnews/**'
      - '_includes/tb-head.html'
      - '_layouts/tb-article-authority.html'
      - 'sitemap-news.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - '.github/workflows/seo-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify approved Insights indexing and sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

