<style>
/* サイト共通ヘッダー（#tbh）は position:fixed で高さ 80px。その分を上に空けないとボタンが隠れる */
.arc-wrap,.arr-wrap{max-width:960px;margin:0 auto;padding:calc(var(--tbh-h,80px) + 28px) 20px 80px;font-family:var(--sans,'Noto Sans JP',system-ui,sans-serif);color:#0f172a}
