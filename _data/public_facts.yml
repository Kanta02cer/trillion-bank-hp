positioning:
  short: "AI検索とAIエージェント時代の情報流通を、測定・証跡・運用へ変えるテクノロジー企業。"
  long: "企業やブランドがAI回答でどのように説明・比較・引用されるかを測定し、正しい一次情報と改善判断へつなげる事業に取り組んでいます。"
products:
  hack2:
    name: "HackⅡ"
    aliases: ["ハックツ", "Hack2", "HackII"]
    status: "限定商用検証・導入相談受付"
    public_definition: "選定した質問について、AI回答本文、引用URL、自社・競合の言及、測定日時・条件を保存し、AI検索上の現在地と改善判断を支援するサービス。"
    verified_scope:
      - "質問・競合の測定設計"
      - "AI回答本文と引用URLの保存"
      - "自社・競合の言及・引用状況の確認"
      - "測定条件と時系列の比較"
      - "CSV等による結果共有"
      - "担当者による分析・改善優先度の整理"
    limitations:
      - "AI検索での掲載、順位、売上、問い合わせを保証しない"
      - "すべてのAIサービス・画面を完全に測定するものではない"
      - "AI内部の選定理由を断定しない"
      - "対応AI・測定頻度・質問数は契約時点の検証範囲で確定する"

  airreach:
    name: "AirReach"
    status: "営業向け無料診断。アンケート後に飲食/BtoB/メディア等の業種専用ページへ遷移し、結論の4数字だけを表示。"
    public_definition: "すりガラスの全画面アンケートで業種・会社URL・目的・調べたい言葉を取得し、/airreach/restaurant/ /b2b/ /media/ など業種専用ページへ遷移する無料入口。飲食なら予約、BtoBなら問い合わせ、メディアなら記事参照など意味のある数字だけを返す。詳細実測はHackⅡ、改善生成はStudio。数字は実測/推定/参考予測/ユーザー入力を区別する。"
    limitations:
      - "ChatGPT・Gemini・Claude・AI Overviewsなどの実回答引用率を本ツール単体では取得しない"
      - "開始時の業種・URL・目的アンケートは必須。回答は端末内（localStorage）に保存し、適切なSales画面への案内に使う"
      - "業種はアンケート回答を優先する。自動推定は補助に留める"
      - "検索需要の一部は推定値であり、Search Console未接続時は公式検索ボリュームではない"
      - "追加予約・問い合わせ・改善後スコア・記事参照予測は仮定に基づく参考レンジであり、掲載・順位・流入・予約・問い合わせ・売上を保証しない"
      - "指定メディアの引用改善は参照候補化と継続計測を意味し、必ず引用されることを保証しない"
      - "Google OAuthライブ連携は接続環境の準備後に有効。未接続時はStudioのCSV取り込みを案内する"
      - "生成ファイルは下書きであり自動公開しない"

  airreach_studio:
    name: "AirReach Studio"
    status: "Phase 1・ブラウザ内実行OS。分析結果と実装用ファイルをZIP下書きとして生成。Studio画面はnoindex。"
    public_definition: "対象URL・目的・キーワード件数・地域を入力すると、既存の診断・キーワード推定・AI質問生成・施策整理をブラウザ内で順に実行し、判断結果と実装用のZIP下書きをまとめるワークスペース。市場検索需要の推定と、任意取込したGSC Impressionsの実測は別の値として表示する。"
    verified_scope:
      - "URL・目的・キーワード件数（20・50・100）・地域を入力するOverview"
      - "ブラウザ内のanalysis_jobによる7ステップの進捗・失敗・再実行管理"
      - "既存の診断・キーワード推定・Prompt生成・Gap／Action生成処理の順次実行"
      - "対策候補KW数・月間検索需要（推定）・今の獲得力・実装可能件数の要約"
      - "市場検索需要の推定値とGSC Impressions実測値の別フィールド・別表示"
      - "キーワード戦略、AI質問候補、ページ・実装箇所単位に圧縮したActionの下書き"
      - "README、MANIFEST、AGENT_PROMPT、strategy、schema、content stubs、llms系ファイル、検証手順を含むZIP下書き"
      - "既存の詳細機能をExpert View内で参照"
    planned_capabilities:
      - capability: "GitHub OAuth、branch作成、Pull Request自動作成、Preview"
        status: "planned"
        connection: "未接続"
      - capability: "人間承認後の本番Deploy"
        status: "planned"
        connection: "未接続"
      - capability: "Google Ads Keyword Plannerまたは外部キーワードDB"
        status: "planned"
        connection: "未接続"
      - capability: "HackⅡ APIによる競合SERP・AI Citationのライブ測定"
        status: "planned"
        connection: "未接続"
      - capability: "Jev Decision Engineと効果検証DB"
        status: "planned"
        connection: "未接続"
    limitations:
      - "Phase 1はブラウザ内処理であり、バックエンドや外部APIの常時接続を前提にしない"
      - "Overviewのサイト確認はブラウザの直接取得のみで、CORS等で取得できない場合は未確認のまま下書き処理を続行する"
      - "市場検索需要は既存モデルによる推定値。GSC Impressionsは対象サイトの実測であり、市場検索需要や公式検索ボリュームとして扱わない"
      - "GSC未接続時は推定値だけを表示し、実測値を0として補完しない"
      - "GSC実測値は取込プロパティと分析対象URLが一致する場合だけ使用し、未確認・不一致時は混ぜない"
      - "競合差とAI質問は調査・実装の候補。競合SERPまたはHackⅡライブ測定の結果ではない"
      - "料金・症例・顧客名・実績を自動創作しない。Schemaは確認済みの可視本文と一致させる"
      - "生成物は人間確認前のZIP下書きであり、GitHub PR作成や本番Deployを実行しない"
      - "掲載・順位・流入・AI言及・AI引用・予約・問い合わせ・売上を保証しない"
  adctor:
    name: "Adctor"
    status: "研究開発・PoC相談"
    public_definition: "AI・RAG・MCP・Agentによるコンテンツ利用を、契約・認証・利用証跡・請求へ接続するための研究開発プロジェクト。"
    limitations:
      - "完成済みの決済・自動徴収・自動分配サービスではない"
      - "未知のAIボットを完全識別するものではない"
      - "外部AIのすべての引用・学習利用を観測するものではない"
