    renamed_on: "2026-09-29"
    status: "限定商用検証・導入相談受付"
    public_definition: "選定した質問について、AI回答本文、引用URL、自社・競合の言及、測定日時・条件を保存し、AI検索上の現在地と改善判断を支援し、測定設計から優先順位整理・継続改善までを伴走するコンサルティングサービス（旧称 HackⅡ / HackⅡ Teams）。"
