positioning:
  short: "AI検索とAIエージェント時代の情報流通を、測定・証跡・運用へ変えるテクノロジー企業。"
  long: "企業やブランドがAI回答でどのように説明・比較・引用されるかを測定し、正しい一次情報と改善判断へつなげる事業に取り組んでいます。"
products:
  hack2:
    name: "HackⅡ"
    aliases: ["ハックツ", "Hack2", "HackII"]
    status: "限定商用検証・導入相談受付"
    public_definition: "選定した質問について、AI回答本文、引用URL、自社・競合の言及、測定日時・条件を保存し、AI検索上の現在地と改善判断を支援するサービス。"
    verified_scope:
      - "質問・競合の測定設計"
      - "AI回答本文と引用URLの保存"
      - "自社・競合の言及・引用状況の確認"
      - "測定条件と時系列の比較"
      - "CSV等による結果共有"
      - "担当者による分析・改善優先度の整理"
    limitations:
      - "AI検索での掲載、順位、売上、問い合わせを保証しない"
      - "すべてのAIサービス・画面を完全に測定するものではない"
      - "AI内部の選定理由を断定しない"
      - "対応AI・測定頻度・質問数は契約時点の検証範囲で確定する"

  airreach:
    name: "AirReach"
    status: "無料診断・Platform集客試算・Studio改善ワークベンチ（CSV実数対応）。OAuthライブ同期とHackⅡ自動測定は導入連携。"
    public_definition: "公開ページ診断に加え、Search Console / GA4のCSV実数を基準にした集客インパクト試算、キーワード別指標、対策ファイル生成（Studio）を提供するAIO計測総合プラットフォーム。シミュレーションは仮定に基づく参考値。実AI横断測定はHackⅡ。"
    limitations:
      - "ChatGPT・Gemini・Claude・AI Overviewsなどの実回答引用率を本ツール単体では取得しない"
      - "表示の追加訪問・追加問い合わせ・ROIは仮定に基づく参考シミュレーションであり、掲載・順位・流入・問い合わせ・売上を保証しない"
      - "GSC/GA4のCSV実数はブラウザ内で処理する。OAuthライブ同期は接続設定後に有効化する"
      - "生成ファイルは下書きであり自動公開しない"
      - "サイト側の取得制限により診断できない場合がある"
  adctor:
    name: "Adctor"
    status: "研究開発・PoC相談"
    public_definition: "AI・RAG・MCP・Agentによるコンテンツ利用を、契約・認証・利用証跡・請求へ接続するための研究開発プロジェクト。"
    limitations:
      - "完成済みの決済・自動徴収・自動分配サービスではない"
      - "未知のAIボットを完全識別するものではない"
      - "外部AIのすべての引用・学習利用を観測するものではない"
