      - "AI内部の選定理由を断定しない"
      - "対応AI・測定頻度・質問数は契約時点の検証範囲で確定する"

  airreach:
    name: "AirReach Tools"
    former_names: ["AirReach"]
    renamed_on: "2026-09-29"
    status: "店舗・営業向け無料診断。URL入力から店情報を確認し、増やしたいことを選んで診断する。"
    public_definition: "ホームページのURLを起点に、お店の確認と「何を増やしたいか」を聞いて診断する無料入口。業種・店名・調べる言葉はサイト情報から自動取得し、必要なら入力画面で業種を選べる。結果は見つかりやすさの点数といちばん最初に直すこと、主ボタン1つを中心に返す。診断は端末内に保存し、診断完了時にサーバーにも保存して共有リンクを発行する（発行できなかった場合は端末内のみ）。/airreach/result/ と /airreach/sales/ から開き直せる。くわしい分析や直す材料は結果の「その他のツール」から。数字はGoogle実測 / AirReach Tools実測 / お客様入力 / 参考予測を区別する。"
    limitations:
      - "ChatGPT・Gemini・Claude・AI Overviewsなどの実回答引用率を本ツール単体では取得しない"
      - "診断結果は端末内（localStorage）に保存し、診断完了時にサーバーへも保存して共有リンクを発行する。共有リンクを知っている人だけが結果を開ける。ログインと顧客DBは後続"
      - "業種・店名・キーワードは自動取得が既定。入力画面で業種を選び直せる"
      - "検索回数は表示しない（文字列からの推定値は使わない）。調べそうな言葉ごとに、答えがサイトに書いてあるかを示す"
      - "追加予約・問い合わせ・改善後スコア・記事参照予測は仮定に基づく参考レンジであり、掲載・順位・流入・予約・問い合わせ・売上を保証しない"
      - "指定メディアの引用改善は参照候補化と継続計測を意味し、必ず引用されることを保証しない"
      - "Google OAuthライブ連携は接続環境の準備後に有効。未接続時はStudioのCSV取り込みを案内する"
      - "生成ファイルは下書きであり自動公開しない"
      - "Sales Modeは端末内の履歴・営業トーク・提案書下書き・商談モードまで。ログインとサーバー顧客DBは未接続"
  hack2_studio:
    name: "AirReach Tools Studio"
    former_names: ["HackⅡ Studio", "AirReach Studio"]
    aliases: ["ハックツ・スタジオ", "Hack2 Studio"]
    status: "ブラウザ内実行OS（Overview司令塔）。分析→キーワード→施策→ZIP／下書きPRまで。"
    public_definition: "URL・目的・対策キーワード件数を入力すると、サイト理解・キーワード選定・AI向け質問・Gap・優先施策・実装パッケージ（ZIP）までを一連のジョブとして進める実行画面。検索回数は推定せず、Keyword Planner CSV取込時のみ公式ボリュームを行単位で表示する。GSC ImpressionsとAirReach Consulting言及・引用は実測として分離する。公開や順位・引用・売上を保証しない。GitHubへの下書きPRはユーザーPATと人間承認前提。本番自動Deployはしない。"
    limitations:
      - "生成ファイルは下書きであり自動公開しない"
      - "市場の検索ボリュームは推定しない。Keyword Planner CSV取込時のみ当該行を公式ボリュームとして扱う"
      - "GSC Impressionsと市場需要を同一の「検索回数」として混ぜない"
      - "GitHub PRは下書き作成まで。マージと本番Deployは人間が行う（自動Deployなし）"
      - "AirReach ConsultingライブAPI未接続時はJSON手動取込。競合は自動で推定・表示しない"
      - "GitHub Personal Access TokenはブラウザのsessionStorageにのみ保持し、リポジトリへ保存しない"
  hack2_platform:
    name: "AirReach Tools Platform"
    former_names: ["HackⅡ Platform", "AirReach Platform"]
    aliases: ["ハックツ・プラットフォーム", "Hack2 Platform"]
