# These paths must never be restored to the public repository. Authentication
# and internal administration require a server-side access-control system in a
# separate private environment, not static HTML or client-side hashes.
forbidden_paths:
  - ".bundle/config"
  - "_data/admin.yml"
  - "_layouts/admin.html"
  - "tools/aio-check/index.html"
  - "assets/js/admin-auth.js"
  - "assets/js/aio-checker.js"
  - "assets/css/admin.css"
  - "assets/css/aio-checker.css"
  - "trillionbank/assets/js/admin-auth.js"
  - "trillionbank/assets/js/aio-checker.js"
  - "trillionbank/assets/css/admin.css"
  - "trillionbank/assets/css/aio-checker.css"
forbidden_prefixes:
  - "admin"

restricted_terms:
  - term: "世界初"
    reason: "比較対象・調査方法・法務承認がない最上級表示"
  - term: "日本初"
    reason: "比較対象・調査方法・法務承認がない最上級表示"
  - term: "業界唯一"
    reason: "市場全体を立証できない独占表示"
  - term: "完全自動"
    reason: "現行サービスは人による設計・QA・分析を含む"
  - term: "必ず表示"
    reason: "AI回答の掲載保証はできない"
  - term: "売上保証"
    reason: "成果保証は提供しない"
  - term: "問い合わせ保証"
    reason: "成果保証は提供しない"
  - term: "AI Exclusive"
    reason: "旧構想・未承認名称"
  - term: "AICS™"
    reason: "旧構想・未承認の認証表現"
  - term: "中央集権型API"
    reason: "旧Regalis期の未検証説明"
  - term: "タグ1行で即日"
    reason: "未検証の導入表現"
  - term: "Regalis AIO Intelligence"
    reason: "旧ブランド"
  - term: "regalis-order-suits.com"
    reason: "旧ドメイン"

# These patterns are checked across all currently built public-source trees,
# including legacy pages and older articles.
global_private_patterns:
  - name: "Japanese mobile phone"
    regex: "0[789]0[- ]?\\d{4}[- ]?\\d{4}"
    reason: "個人電話番号を公開ソースへ記載しない"
  - name: "credential assignment"
    regex: "(?i)(api[_ -]?key|client[_ -]?secret|access[_ -]?token|refresh[_ -]?token|password)\\s*[:=]\\s*[\"']?[^\\s<{\"']{8,}"
    reason: "認証情報を公開ソースへ保存しない"

# These business-sensitive patterns are checked only in the reviewed release
# candidate sources below to avoid treating general educational references as
# company disclosures.
private_patterns:
  - name: "valuation"
    regex: "(pre[- ]?money|post[- ]?money|企業価値|バリュエーション)"
    reason: "未公表の資本政策・企業価値を公開しない"
  - name: "cap table"
    regex: "(cap table|株主構成|持株比率|発行済株式)"
    reason: "株主・資本政策情報は個別承認なしに公開しない"
  - name: "cash position"
    regex: "(現預金|銀行残高|ランウェイ)"
    reason: "財務情報は個別承認なしに公開しない"

# AirReach の結果画面・営業文言は「ホームページの情報整備」に限定する。
# AI掲載率・検索順位・予約数を断定する表現、HackⅡ を対策として混ぜる表現を検出する。
# 否定形（〜ではありません／保証しません）は許容するため、断定形だけを正規表現で拾う。
scoped_claim_patterns:
  - name: "airreach: AI掲載・順位・予約の断定"
    roots:
      - "assets/js/airreach-diagnose.js"
      - "assets/js/airreach-sales.js"
      - "assets/js/airreach-sales-kit.js"
      - "assets/js/airreach-industry.js"
      - "assets/js/airreach-display.js"
      - "assets/js/airreach-scan-sync.js"
      - "_includes/airreach-app.html"
      - "_includes/airreach-industry-seo.html"
      - "_data/airreach_display.yml"
      - "_data/airreach_industries.yml"
    patterns:
      - regex: "(AI検索で|AIに)候補に入(り|る)(にくい|やすい)"
        reason: "点数はホームページの情報整備であり、AI回答での候補入りを示さない"
      - regex: "AIに紹介され(やすく|る確率が上が)"
        reason: "AI掲載率は本ツールで測っていない"
      - regex: "(検索)?順位が(上が|改善し)"
        reason: "検索順位は本ツールで測っていない"
      - regex: "(予約|問い合わせ|来店|売上)が増え(ます|る。)"
        reason: "成果を断定しない（「可能性」「目安」までに留める）"
      - regex: "必ず(引用|掲載|紹介)され(ます|る)(?![か保こ])"
        reason: "掲載・引用の保証はできない"
      - regex: "slot: 'PARTNER'[^\\n]*\\n[^\\n]*actions\\.push"
        reason: "HackⅡ / Teams は対策（actions）に混ぜず referral として別枠で出す"
      - regex: "cta: 'HackⅡ Studioで作る'"
        reason: "対策カードから HackⅡ Studio への誘導は削除済み（根拠リンクのみ残す）"

allowed_paths_for_restricted_terms:
