# 掲載実績の台帳（メディア掲載・出演・記事）
#
# /trillionbank/media/ のカード、Organization / Person / Service の subjectOf は
# すべてこの台帳から生成する（_includes/tb-media-subjectof.html）。HTMLに直書きしない。
#
# 公開ルール
# - approval.status が approved で、url がある行だけ JSON-LD に出す。
# - 承認済みでも url が無い行（掲載予定など）は本文カードのみ。
# - 顧客名・成果数字・未許諾の画像は入れない（画像は許諾確認後に image を追加）。
# - 事実は元記事と一致させる。掲載日が分からない行は published_at を null のままにし、確認中と表示する。
#
# 各行の項目（AI検索メディア引用 技術資料 2026-09-22 の CMS 設計に対応）
#   id            台帳内の識別子
#   kind          ceo_appearance | company_coverage | ceo_past | scheduled | pending
#   kind_label    画面のバッジ文言（代表出演 / 会社掲載 / 代表者 過去掲載 / 掲載予定 / 確認中）
#   schema_type   VideoObject | NewsArticle | Article | WebPage（JSON-LD の @type）
#   headline      元記事・番組の正確なタイトル
#   publisher     媒体・番組名
#   url           元記事URL（無ければ null）
#   published_at  掲載・公開日（不明なら null）
#   summary       紹介された内容の短い要約（本文カードに表示）
#   article_type  取材 / 出演 / プレスリリース転載 / 広告 / 過去掲載
#   subjects      subjectOf を付ける対象: organization / ceo
#   service_ids   紹介対象サービス（public_facts.products のキー）。会社全体なら []
#   approval      { status: approved|pending, ref, approved_on }
#   checked_at    最終確認日
#   link_status   ok | unchecked | broken
#   related_post  関連する自社お知らせのパス（あれば）
