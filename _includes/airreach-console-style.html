<style>
.arc-wrap,.arr-wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;font-family:var(--sans,'Noto Sans JP',system-ui,sans-serif);color:#0f172a}
.arc-loading{color:#64748b}

.arc-h1{font-size:1.5rem;margin:4px 0 0}
.arc-h2{font-size:1.05rem;margin:0 0 10px}
.arc-back{font-size:.85rem;color:#2563eb;text-decoration:none}
.arc-who{font-size:.85rem;color:#64748b}
.arc-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin:0 0 16px}
.arc-login{max-width:440px;margin:40px auto}
.arc-lead{color:#475569;margin:6px 0 14px}
.arc-label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}

.arc-btn:focus-visible,.arc-btn-sm:focus-visible,.arc-input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
