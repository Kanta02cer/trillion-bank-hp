<script>
(function(){
  var h=document.getElementById('tbh'),last=0;
  var rails=document.getElementById('glowRails');
  var railGate=Math.min(innerHeight*.3,280);
  addEventListener('scroll',function(){var y=scrollY;h.classList.toggle('solid',y>8);if(y>last&&y>140){h.classList.add('hide')}else{h.classList.remove('hide')}last=y;
    if(rails)rails.classList.toggle('active',y>railGate);},{passive:true});
  var b=document.getElementById('tbBurger');
  if(b)b.addEventListener('click',function(){var o=h.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  document.querySelectorAll('.tbh .links a').forEach(function(a){a.addEventListener('click',function(){h.classList.remove('open')})});
  // mega menu keyboard toggle
  document.querySelectorAll('.mega-t').forEach(function(btn){
    var panel=document.getElementById(btn.getAttribute('aria-controls'));
    if(!panel)return;
    btn.addEventListener('click',function(){var open=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',!open)});
    btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();btn.click();if(btn.getAttribute('aria-expanded')==='true'){var first=panel.querySelector('a');if(first)first.focus()}}
      if(e.key==='Escape'){btn.setAttribute('aria-expanded','false');btn.focus()}});
    panel.addEventListener('keydown',function(e){if(e.key==='Escape'){btn.setAttribute('aria-expanded','false');btn.focus()}});
  });
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  document.querySelectorAll('.rv').forEach(function(el,i){el.style.transitionDelay=(i%3)*70+'ms';io.observe(el)});
  // GA4 tracking for CTAs
  document.querySelectorAll('[data-event]').forEach(function(el){
    el.addEventListener('click', function(){
      if(typeof gtag==='function'){
        gtag('event', el.dataset.event, {
          source_page: location.pathname,
          service: el.dataset.service || '',
          inquiry_type: el.dataset.inquiry || '',
          cta_label: el.textContent.trim()
        });
      }
    });
  });
  // AI referral attribution for AirReach Consulting reports.
  (function(){
    var definitions=[
      {source:'ChatGPT',hosts:['chatgpt.com','openai.com'],tokens:['chatgpt','openai']},
      {source:'Perplexity',hosts:['perplexity.ai'],tokens:['perplexity']},
      {source:'Claude',hosts:['claude.ai','anthropic.com'],tokens:['claude','anthropic']},
      {source:'Gemini',hosts:['gemini.google.com'],tokens:['gemini','bard']},
      {source:'Google AI',hosts:['google.com','google.co.jp'],tokens:['ai_overview','ai-mode','aimode','google_ai']},
      {source:'Microsoft Copilot',hosts:['copilot.microsoft.com','bing.com'],tokens:['copilot','bing_ai']},
      {source:'You.com',hosts:['you.com'],tokens:['you.com','youchat']},
      {source:'Poe',hosts:['poe.com'],tokens:['poe']},
      {source:'Phind',hosts:['phind.com'],tokens:['phind']}
    ];
    function normalizedHost(value){
      try{return new URL(value).hostname.replace(/^www\./,'').toLowerCase()}catch(e){return ''}
    }
    function tokenMatch(text,tokens){
      text=(text||'').toLowerCase();
      return tokens.some(function(token){return text.indexOf(token)!==-1});
    }
    function findSource(referrer,paramsText){
      var host=normalizedHost(referrer);
      for(var i=0;i<definitions.length;i++){
        var def=definitions[i];
        var matchedHost=def.hosts.some(function(item){return host===item||host.endsWith('.'+item)});
        if(matchedHost&&host.indexOf('google.')===-1&&host!=='bing.com')return {name:def.source,type:'referrer',host:host};
        if((matchedHost||!host)&&tokenMatch(paramsText,def.tokens))return {name:def.source,type:matchedHost?'referrer_param':'utm',host:host};
      }
      return null;
    }
    function sendEvent(name,payload){
      if(typeof gtag==='function')gtag('event',name,payload);
    }
    var params=new URLSearchParams(location.search);
    var paramsText=[
      params.get('utm_source'),
      params.get('utm_medium'),
      params.get('utm_campaign'),
      params.get('ref'),
      params.get('source'),
      params.get('ai_source')
    ].filter(Boolean).join(' ');
    var detected=findSource(document.referrer,paramsText);
    var stored=null;
    if(detected){
      stored={
        ai_source:detected.name,
        ai_referrer_host:detected.host||'direct_param',
        ai_source_type:detected.type,
        ai_landing_path:location.pathname,
        traffic_channel:'ai_search'
      };
      try{sessionStorage.setItem('tb_ai_referral',JSON.stringify(stored))}catch(e){}
      sendEvent('ai_referral_visit',stored);
    }else{
      try{stored=JSON.parse(sessionStorage.getItem('tb_ai_referral')||'null')}catch(e){stored=null}
    }
    document.querySelectorAll('a[href*="/trillionbank/contact/"],a[href*="/trillionbank/meeting/"]').forEach(function(link){
      link.addEventListener('click',function(){
        var attribution=stored;
        try{attribution=attribution||JSON.parse(sessionStorage.getItem('tb_ai_referral')||'null')}catch(e){}
        if(!attribution)return;
        sendEvent('ai_assisted_cta_click',{
          ai_source:attribution.ai_source,
          ai_referrer_host:attribution.ai_referrer_host,
          ai_landing_path:attribution.ai_landing_path,
          cta_label:(link.dataset.cta||link.textContent||'').trim(),
          destination:link.href,
          source_page:location.pathname
        });
      });
    });
  })();
  // tabs (WAI-ARIA Tabs pattern: arrow key navigation + roving tabindex)
  document.querySelectorAll('[data-tabs]').forEach(function(g){
    var tabs=g.querySelectorAll('[role="tab"]'),panels=g.querySelectorAll('[role="tabpanel"]');
    function activate(idx){
      tabs.forEach(function(x){x.setAttribute('aria-selected','false');x.setAttribute('tabindex','-1')});
      tabs[idx].setAttribute('aria-selected','true');tabs[idx].setAttribute('tabindex','0');tabs[idx].focus();
      panels.forEach(function(p){p.classList.remove('on')});if(panels[idx])panels[idx].classList.add('on');
    }
    tabs.forEach(function(t,i){
      t.addEventListener('click',function(){activate(i)});
      t.addEventListener('keydown',function(e){
        var k=e.key,n=tabs.length;
        if(k==='ArrowRight'){e.preventDefault();activate((i+1)%n)}
        else if(k==='ArrowLeft'){e.preventDefault();activate((i-1+n)%n)}
        else if(k==='Home'){e.preventDefault();activate(0)}
        else if(k==='End'){e.preventDefault();activate(n-1)}
      });
    });
  });
  /* page transition — fade out on navigate, fade in on load */
  document.addEventListener('click',function(e){
    var a=e.target.closest('a');
    var raw=a?a.getAttribute('href')||'':'';
    if(!a||!a.href||a.target==='_blank'||raw.startsWith('#')||a.href.startsWith('mailto:')||a.href.startsWith('tel:'))return;
    if(a.hostname!==location.hostname)return;
    if(a.pathname===location.pathname&&a.hash)return;
    e.preventDefault();
    document.body.classList.add('page-leaving');
    setTimeout(function(){location.href=a.href},300);
  });
  window.addEventListener('pageshow',function(e){
    document.body.classList.remove('page-leaving');
  });
})();
</script>
